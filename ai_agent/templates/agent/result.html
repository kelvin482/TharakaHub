<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Result</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ai_agent/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>AI Agent Result</h1>

        <!-- Graph -->
        <div class="graph-container">
            <img src="data:image/png;base64,{{ graph }}" alt="plot"/>
        </div>

        <!-- Data Table -->
        <h2>Data</h2>
        <div class="table-container">
            {{ table|safe }}
        </div>

        <!-- Back Button -->
        <a href="{% url 'agent:upload' %}" class="back-btn">Back</a>
    </div>
</body>
</html>
