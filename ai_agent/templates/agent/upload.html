<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Upload</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ai_agent/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Upload CSV for AI Agent</h1>
        <form action="{% url 'agent:plot' %}" method="post" enctype="multipart/form-data" class="upload-form">
            {% csrf_token %}
            <input type="file" name="csv_file" accept=".csv" required>
            <button type="submit">Analyze & Plot</button>
        </form>
        <p class="example-text">CSV format example (headers): <strong>Month,Sales</strong></p>
    </div>
</body>
</html>
